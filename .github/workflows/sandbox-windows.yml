name: sandbox-windows

# The Windows sandbox (src/sandbox/backend/direct_windows.rs) was written on a
# Mac and had never run on Windows. A hosted Windows runner is a real Windows:
# these tests make real AppContainer profiles and launch real processes in them,
# so a green run is the first evidence that the jail holds — and a red one says
# which promise broke (write, read, network, tree-kill, ACL merge).
#
# Not part of `release` on purpose: that job only needs the binary to build.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/sandbox/**"
      - "Cargo.toml"
      - ".github/workflows/sandbox-windows.yml"
      - ".github/scripts/annotate-test-failures.sh"
  push:
    branches: [main]
    paths:
      - "src/sandbox/**"
      - ".github/workflows/sandbox-windows.yml"
      - ".github/scripts/annotate-test-failures.sh"

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # One thread: the tests share the machine's AppContainer profile list and
      # the process-wide grant cache, and the timing ones should not compete for
      # a core with a neighbour.
      # Block scalars: an unquoted `backend:: --` holds `: `, which YAML reads as
      # a mapping, and GitHub rejected the whole file before creating any job.
      # A failure is also written as annotations: the log needs a sign-in to
      # read, the annotations on the run page do not.
      - name: Windows sandbox tests (real AppContainer)
        shell: bash
        run: |
          cargo test --lib sandbox::backend:: -- --test-threads=1 --nocapture 2>&1 | tee backend-tests.log || {
            status=$?
            bash .github/scripts/annotate-test-failures.sh backend-tests.log error
            exit $status
          }

      # Everything else under src/sandbox, including the runner tests that start
      # Python inside the container (the step the research document calls
      # decisive). Informational for now: some of those tests were written for
      # Unix and may fail here for reasons that have nothing to do with the jail.
      # It runs even when the step above failed, since what it finds is the point.
      - name: Rest of the sandbox suite (informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cargo test --lib sandbox:: -- --test-threads=1 --nocapture 2>&1 | tee sandbox-tests.log || {
            status=$?
            bash .github/scripts/annotate-test-failures.sh sandbox-tests.log warning
            exit $status
          }

      # The same module type-checked as the shipped binary builds it.
      - name: Build the daemon
        if: always()
        shell: bash
        run: cargo build --bin senclaw
