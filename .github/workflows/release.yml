name: release

# Tag push (`v0.1.0`, …) → build the daemon binary per platform and publish it
# on this repo's GitHub release. `scripts/install.sh`, `scripts/install.ps1`
# and `senclaw update` (src/cli/commands/distrib.rs) download exactly these
# asset names; the desktop repo builds its own copy to bundle into the app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # git2 builds libgit2/libssh2 against the system OpenSSL on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The daemon links no inference code (docs/runtime-protocol.md), so every
      # platform builds the same way — no feature matrix.
      - name: Build senclaw
        shell: bash
        env:
          # Optional: replace the Google OAuth clients built into the daemon
          # for the Antigravity and Gemini CLI sign-ins
          # (src/providers/oauth/provider.rs). An unset secret keeps the built-in one.
          SENCLAW_ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.SENCLAW_ANTIGRAVITY_OAUTH_CLIENT_ID }}
          SENCLAW_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.SENCLAW_ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          SENCLAW_GEMINI_CLI_OAUTH_CLIENT_ID: ${{ secrets.SENCLAW_GEMINI_CLI_OAUTH_CLIENT_ID }}
          SENCLAW_GEMINI_CLI_OAUTH_CLIENT_SECRET: ${{ secrets.SENCLAW_GEMINI_CLI_OAUTH_CLIENT_SECRET }}
        run: cargo build --release --bin senclaw --target ${{ matrix.target }}

      # The binary must start on a Mac without Homebrew. A library under
      # /opt/homebrew or /usr/local exists only on the build machine: git2 once
      # linked the runner's OpenSSL, and a runner moving to openssl@4 shipped a
      # daemon that failed to load on every Mac with openssl@3.
      - name: Check the daemon links no Homebrew library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          libs=$(otool -L "target/${{ matrix.target }}/release/senclaw" | tail -n +2)
          echo "$libs"
          if grep -E '/opt/homebrew/|/usr/local/' <<<"$libs"; then
            echo "::error::senclaw links a Homebrew library; it would not start on a Mac without it"
            exit 1
          fi

      - name: Collect asset
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/senclaw${ext}" "dist/senclaw-${{ matrix.target }}${ext}"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
