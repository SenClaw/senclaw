components:
  securitySchemes:
    bearerToken:
      description: 'The daemon API token: SENCLAW_API_TOKEN, else the generated ~/.senclaw/api_token.'
      scheme: bearer
      type: http
    sessionCookie:
      description: Minted by POST /api/auth/login.
      in: cookie
      name: senclaw_token
      type: apiKey
    tokenHeader:
      description: The same token, for clients that cannot set Authorization.
      in: header
      name: X-SenClaw-Token
      type: apiKey
info:
  description: |-
    Generated from the daemon's own routers. Paths, methods and path parameters are exact. Bodies are not described: handlers that return `Json<serde_json::Value>` are marked `x-untyped: true`, and `x-untyped-operations` counts how many remain.

    A few templates overlap (`/api/oauth/{provider}/start` and `/api/oauth/accounts/{id}`, for example). That is not a conflict at runtime: axum matches a literal segment before a capture, so `/api/oauth/accounts/1` reaches the accounts handler. A client generated from this document should prefer the more literal template for the same reason.
