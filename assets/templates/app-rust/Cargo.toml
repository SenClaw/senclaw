[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2021"

# Its own workspace root. Without this, creating the app inside another Cargo
# workspace (a monorepo, or the SenClaw checkout) makes it a silent member of
# that workspace, and `cargo build` here starts building the parent.
[workspace]

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
futures = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
