<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; padding: 2rem;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
      p  { margin: .25rem 0 1.25rem; opacity: .7; }
      button { font: inherit; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; }
      pre {
        background: rgba(127,127,127,.12); padding: 1rem; border-radius: 8px;
        overflow-x: auto; margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>🐹 Go Demo</h1>
    <p>
      A <strong>session</strong> Space App: the daemon starts it when you open
      this page or when an agent calls one of its tools, and stops it again
      after 60 seconds with nobody using it.
    </p>
    <button id="go">Call /api/visit</button>
    <pre id="out">not called yet</pre>
    <script>
      // Same-origin: the daemon proxies this page and the app's API under the
      // same path, so a relative URL is all that is ever needed.
      const out = document.getElementById('out');
      document.getElementById('go').onclick = async () => {
        out.textContent = '…';
        try {
          const r = await fetch('api/visit', { method: 'POST' });
          out.textContent = JSON.stringify(await r.json(), null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      };
      fetch('api/status').then(r => r.json()).then(s => {
        out.textContent = JSON.stringify(s, null, 2);
      }).catch(() => {});
    </script>
  </body>
</html>
