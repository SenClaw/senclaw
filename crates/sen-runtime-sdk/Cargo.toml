# Its own workspace root: every sen-* runtime depends on this crate by path, and
# must not have to parse the daemon's manifest to build.
[workspace]

[package]
name = "sen-runtime-sdk"
version = "0.1.0"
edition = "2021"
description = "Shared contract for SenClaw runtimes: the senclaw-runtime.json manifest, the launch environment, and the loopback server scaffold every runtime mounts"
license = "MIT"
repository = "https://github.com/SenClaw/senclaw"

[features]
# The daemon only needs the manifest and environment types; a runtime binary
# also wants the axum scaffold (health, auth, parent watchdog, shutdown).
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tracing-subscriber", "dep:libc", "dep:windows-sys", "dep:anyhow"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
dirs = "5"

axum = { version = "0.7", optional = true, features = ["json"] }
tokio = { version = "1", optional = true, features = ["full"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
anyhow = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
